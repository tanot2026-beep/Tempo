name: Build portable Windows zip

# Manual run: Actions tab > "Build portable Windows zip" > Run workflow.
# The finished zip appears under "Artifacts" at the bottom of the run page.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Install Rust (stable, 1.95 or newer needed)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: portable-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch OCR models (used by Scan & OCR)
        run: cargo xtask models

      - name: Build
        run: cargo build --release -p pdfcraft

      - name: List the Windows DLLs and functions the exe imports
        shell: pwsh
        run: |
          rustup component add llvm-tools
          $sysroot = (rustc --print sysroot).Trim()
          $readobj = Get-ChildItem -Path $sysroot -Recurse -Filter llvm-readobj.exe | Select-Object -First 1
          if (-not $readobj) { throw "llvm-readobj.exe not found under $sysroot" }
          & $readobj.FullName --coff-imports target/release/pdfcraft.exe | Out-File imports-raw.txt -Encoding utf8

          # One block per imported DLL (normal imports and delay-loaded ones).
          $dlls = [ordered]@{}
          $name = $null
          foreach ($line in Get-Content imports-raw.txt) {
            if ($line -match '^\s*Name:\s*(\S+\.dll)\s*$') { $name = $Matches[1].ToLower(); if (-not $dlls.Contains($name)) { $dlls[$name] = New-Object System.Collections.Generic.List[string] } }
            elseif ($name -and $line -match '^\s*Symbol:\s*(\S+)') { $dlls[$name].Add($Matches[1]) }
          }
          $out = New-Object System.Collections.Generic.List[string]
          $out.Add("== Every imported DLL and how many functions are taken from it ==")
          foreach ($k in $dlls.Keys) { $out.Add(("{0,-40} {1}" -f $k, $dlls[$k].Count)) }
          foreach ($k in $dlls.Keys) {
            if ($k -match 'wininet|winhttp|ws2_32|wsock32|mswsock|urlmon|dnsapi|iphlpapi|httpapi') {
              $out.Add("")
              $out.Add("== Functions imported from $k ==")
              foreach ($f in ($dlls[$k] | Sort-Object -Unique)) { $out.Add($f) }
            }
          }
          $out | Tee-Object -FilePath imports-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: imports-report
          path: imports-report.txt
          if-no-files-found: error

      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory PdfCraft-Portable | Out-Null
          Copy-Item target/release/pdfcraft.exe PdfCraft-Portable/
          # portable.txt keeps settings and logs in PdfCraftData next to the exe.
          Set-Content -Path PdfCraft-Portable/portable.txt -Value "portable"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE PdfCraft-Portable/

      - uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-Portable-windows-x64
          path: PdfCraft-Portable/
          if-no-files-found: error
